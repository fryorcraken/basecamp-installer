schema: spec-driven

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
context: |
  The shipped artifact is one POSIX sh file that downloads release bytes over
  a peer-to-peer network and installs software with the user's privileges.
  Treat all network bytes as untrusted and make verification fail closed.
  A CID depends on filename and block size, so specs that produce or check a
  CID must state both. Windows, macOS x86_64, a custom bootstrap and a Basecamp
  self-update are out of scope. See docs/DESIGN.md for the decisions and risks.

